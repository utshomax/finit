services:
  mongodb:
    image: mongo:7
    container_name: finit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: finit
      MONGO_INITDB_ROOT_PASSWORD: finit_dev_password
      MONGO_INITDB_DATABASE: finit
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://finit:finit_dev_password@localhost:27017/admin",
          "--eval",
          "db.adminCommand({ ping: 1 }).ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
